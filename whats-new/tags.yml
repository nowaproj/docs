# Tags for release pages. A release page can only use the tags listed here.
# Each tag gets a page at /new/whats-new/tags/<permalink> listing its releases.

nowa-ai:
  label: Nowa AI
  permalink: /nowa-ai
  description: Releases that changed Nowa AI, its modes and the agents that work with Nowa.

design:
  label: Design
  permalink: /design
  description: Releases that changed the board, widgets, themes, templates and the Library.

logic:
  label: Logic
  permalink: /logic
  description: Releases that changed Circuit, variables, functions and navigation.

integrations:
  label: Integrations
  permalink: /integrations
  description: Releases that changed APIs, Supabase, Firebase, payments, maps and other services.

preview:
  label: Preview and test
  permalink: /preview
  description: Releases that changed Instant Play, Run, sharing and testing on your devices.

publish:
  label: Publish
  permalink: /publish
  description: Releases that changed deploying to the web and getting into the App Store and Google Play.

code:
  label: Code and Git
  permalink: /code
  description: Releases that changed working with code, packages, local projects and Git.

account:
  label: Account and teams
  permalink: /account
  description: Releases that changed your account, workspaces, organizations and the dashboard.
